name: Verify interrupted browser remainder

on:
  push:
    branches: ['codex/**']
    paths:
      - '.github/workflows/verify-browser-remainder.yml'
      - 'scripts/verify-browser-remainder.mjs'
      - 'scripts/tests/verify-browser-remainder.test.mjs'
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Interrupted immutable application verification run
        default: '39131052952'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  remainder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VNDRLY_TEST_DB_MODE: fresh-local
      VNDRLY_TEST_DB_MAINTENANCE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      VNDRLY_LOAD_ENV_LOCAL: '0'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify continuation mechanism contracts
        run: node --test scripts/tests/verify-browser-remainder.test.mjs
      - name: Validate baseline provenance and immutable application tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '39131052952' }}
        run: node scripts/verify-browser-remainder.mjs prepare "$BASELINE_RUN_ID" "$RUNNER_TEMP/vndrly-browser-remainder"
      - run: pnpm install --frozen-lockfile
      - name: Install pinned browser
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources <<'PY'
          import pathlib, re, sys
          for name in sys.argv[1:]:
              source = pathlib.Path(name)
              if not source.exists():
                  continue
              text = source.read_text()
              text = re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu', 'https://archive.ubuntu.com/ubuntu', text)
              text = re.sub(r'http://(?:[a-z]{2}\.)?archive\.ubuntu\.com/ubuntu', 'https://archive.ubuntu.com/ubuntu', text)
              text = text.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
              source.write_text(text)
          PY
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-vndrly-acquire >/dev/null
          pnpm --filter @workspace/e2e exec playwright install --with-deps chromium
          browser_path="$(pnpm --filter @workspace/e2e exec node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser_path"
          printf 'PLAYWRIGHT_CHROMIUM=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Start fresh runner-local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_config >/dev/null || ! test -x "$(pg_config --bindir)/initdb"; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql
          fi
          pg_bin="$(pg_config --bindir)"
          pg_data="$RUNNER_TEMP/vndrly-browser-remainder-postgres"
          test ! -e "$pg_data"
          "$pg_bin/initdb" --pgdata="$pg_data" --username=postgres --auth=trust
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/vndrly-browser-remainder/postgres.log" --options="-h 127.0.0.1 -p 55439 -k '$RUNNER_TEMP'" --wait start
          printf 'VNDRLY_CI_PG_BIN=%s\nVNDRLY_CI_PG_DATA=%s\n' "$pg_bin" "$pg_data" >> "$GITHUB_ENV"
      - name: Run exactly the interrupted browser cases in a new isolated database
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- node ../../scripts/verify-browser-remainder.mjs run "$RUNNER_TEMP/vndrly-browser-remainder"
      - name: Retain baseline, inventory, continuation and coverage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-remainder-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vndrly-browser-remainder
            lib/e2e/test-results
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable PostgreSQL
        if: always() && env.VNDRLY_CI_PG_DATA != ''
        shell: bash
        run: '"$VNDRLY_CI_PG_BIN/pg_ctl" --pgdata="$VNDRLY_CI_PG_DATA" --mode=fast --wait stop'
