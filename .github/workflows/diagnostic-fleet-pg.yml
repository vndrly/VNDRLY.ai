name: Diagnostic Fleet PostgreSQL
on:
  push:
    branches: ['diagnostic/fleet-pg-*']
permissions:
  contents: read
concurrency:
  group: diagnostic-fleet-pg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: startsWith(github.ref, 'refs/heads/diagnostic/fleet-pg-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VNDRLY_TEST_DB_MODE: fresh-local
      VNDRLY_TEST_DB_MAINTENANCE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      VNDRLY_LOAD_ENV_LOCAL: '0'
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start owned runner-local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          pg_data="$RUNNER_TEMP/vndrly-fleet-diagnostic-postgres"
          test ! -e "$pg_data"
          "$pg_bin/initdb" --pgdata="$pg_data" --username=postgres --auth=trust
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/fleet-postgres.log" --options="-h 127.0.0.1 -p 55439 -k '$RUNNER_TEMP'" --wait start
          printf 'VNDRLY_CI_PG_BIN=%s\nVNDRLY_CI_PG_DATA=%s\n' "$pg_bin" "$pg_data" >> "$GITHUB_ENV"
      - name: Validate fresh-local safety constraints
        run: node --test scripts/tests/fresh-test-database.test.mjs
      - name: Run focused real PostgreSQL Fleet tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run --no-file-parallelism src/services/fleet-availability.database.test.ts src/test-utils/instrument-pool-connect.test.ts 2>&1 | tee "$RUNNER_TEMP/fleet-focused-tests.log"
      - name: Retain focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-focused-pg-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fleet-focused-tests.log
            ${{ runner.temp }}/fleet-postgres.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop owned PostgreSQL
        if: always() && env.VNDRLY_CI_PG_DATA != ''
        run: '"$VNDRLY_CI_PG_BIN/pg_ctl" --pgdata="$VNDRLY_CI_PG_DATA" --mode=fast --wait stop'