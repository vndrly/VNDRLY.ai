name: Coverage release check
on:
  push:
    branches: ['release/coverage-*']
  workflow_dispatch:
    inputs:
      required_checks:
        description: JSON list of required components to run; reuse passing checks for unchanged components
        type: string
        default: '["types","libraries","web","mobile","api","browser"]'
      full_required:
        description: Run all required validation components in parallel before full ship
        type: boolean
        default: false
      compile_only:
        description: Reuse passing functional checks and rerun compilation only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compile:
    if: ${{ inputs.full_required != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/vndrly run typecheck
      - run: pnpm lint:i18n
  conversations:
    if: ${{ inputs.compile_only != true && inputs.full_required != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VNDRLY_TEST_DB_MODE: fresh-local
      VNDRLY_TEST_DB_MAINTENANCE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      VNDRLY_LOAD_ENV_LOCAL: '0'
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify affected web behavior
        run: pnpm --filter @workspace/vndrly exec vitest run src/components/work-hub/receipt-editor.test.tsx src/components/work-hub/note-editor.test.tsx src/components/work-hub/conversation-attachments.test.tsx src/components/work-hub/conversation-transcript.test.tsx src/components/work-hub/collaboration.test.tsx src/components/work-hub/new-chat.test.tsx src/components/work-hub/chat-participants.test.tsx src/components/work-hub/conversation-title.test.tsx src/components/work-hub/files-deeplink.test.tsx src/components/work-hub/share-file-to-channel.test.tsx src/components/work-hub/calendar-summary-cards.test.tsx src/components/work-hub/unread-chat-preview.test.tsx --maxWorkers=1
      - name: Start a new runner-local PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_config >/dev/null || ! test -x "$(pg_config --bindir)/initdb"; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql
          fi
          pg_bin="$(pg_config --bindir)"
          pg_data="$RUNNER_TEMP/vndrly-verification-postgres"
          test ! -e "$pg_data"
          "$pg_bin/initdb" --pgdata="$pg_data" --username=postgres --auth=trust
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/vndrly-postgres.log" --options="-h 127.0.0.1 -p 55439 -k '$RUNNER_TEMP'" --wait start
      - name: Verify affected API behavior on a new isolated database
        run: pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run src/work-hub/receipts.test.ts src/routes/workHubReceipts.test.ts src/routes/workHubFileLibrary.test.ts src/routes/workHubFileLibrary.contract.test.ts src/routes/workHubUnread.test.ts src/work-hub/channel-file-reference.test.ts src/work-hub/start-chat.test.ts src/work-hub/chat-participants.test.ts src/work-hub/channel-members.test.ts src/work-hub/collaboration-access.test.ts src/work-hub/queries.test.ts --no-file-parallelism --maxWorkers=1

  required-checks:
    if: ${{ inputs.full_required == true }}
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.required_checks || '["types","libraries","web","mobile","api","browser"]') }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VITEST_MAX_WORKERS: '2'
      VNDRLY_TEST_DB_MODE: fresh-local
      VNDRLY_TEST_DB_MAINTENANCE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      VNDRLY_LOAD_ENV_LOCAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated runner database
        if: matrix.check == 'api' || startsWith(matrix.check, 'api-') || startsWith(matrix.check, 'browser')
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          if ! test -x "$pg_bin/initdb"; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql
            pg_bin="$(pg_config --bindir)"
          fi
          pg_data="$RUNNER_TEMP/vndrly-handoff-check"
          test ! -e "$pg_data"
          "$pg_bin/initdb" --pgdata="$pg_data" --username=postgres --auth=trust
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/vndrly-postgres.log" --options="-h 127.0.0.1 -p 55439 -k '$RUNNER_TEMP'" --wait start
      - name: Install test browser
        if: startsWith(matrix.check, 'browser')
        run: pnpm --filter @workspace/e2e exec playwright install --with-deps chromium
      - name: Run required check
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.check }}' in
            types)
              pnpm run typecheck:libs
              pnpm -r --workspace-concurrency=1 --filter './artifacts/**' --filter './scripts' --if-present run typecheck
              pnpm lint:i18n
              ;;
            libraries) pnpm run test:libs ;;
            web) pnpm run test:web ;;
            web-handshake) pnpm --filter @workspace/vndrly exec vitest run src/components/modal-inventory.test.ts src/pages/gate-history.plate-display.test.tsx src/pages/gatekeeper.export-pills.test.tsx src/pages/vendors.recon-alerts.test.tsx src/pages/partner-catalog.marketplace.test.tsx src/pages/ticket-detail.assignment-removed.test.tsx src/pages/ticket-detail.audit-payment-reversed.test.tsx src/pages/ticket-detail.live-connection-pill.test.tsx src/pages/ticket-detail.live-gap-banner.test.tsx src/pages/ticket-detail.status-pills.test.tsx src/components/ticket-submitted-proof.test.tsx src/components/service-marketplace/vendor-discovery.test.tsx src/components/service-marketplace/job-offer-flow.test.tsx src/components/service-marketplace/partner-catalog-import.test.tsx src/components/gate-daily-billing-panel.test.tsx src/pages/print-ticket.proof-packet.test.tsx --maxWorkers=2 ;;
            mobile) pnpm run test:mobile ;;
            mobile-handshake) pnpm --filter @workspace/vndrly-mobile exec vitest run app/__tests__/service-marketplace.test.tsx components/TicketSubmittedProof.test.tsx components/GateDailyBillingPanel.test.tsx lib/locales --maxWorkers=2 ;;
            types-mobile) pnpm run typecheck:libs && pnpm --filter @workspace/vndrly-mobile run typecheck && pnpm --filter @workspace/scripts run typecheck && pnpm lint:i18n ;;
            api) pnpm run test:api ;;
            api-handshake) pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run src/assistant/chatgpt-read-scope.integration.test.ts src/routes/code-literal-mobile-i18n-coverage.test.ts src/routes/invoices.test.ts src/routes/tickets-mutation-codes.test.ts src/services/gate-daily-billing.database.test.ts src/services/marketplace/feature.test.ts src/lib/ticket-submissions.test.ts src/routes/tickets-submission-review.test.ts src/services/gate-daily-billing-handshake.test.ts src/services/marketplace/job-offers.database.test.ts src/services/marketplace/job-offers.test.ts src/services/marketplace/partner-catalog-import.test.ts src/services/marketplace/quote-request.test.ts src/routes/partner-catalog-import.test.ts src/lib/invoice-marketplace-afe.test.ts --no-file-parallelism --maxWorkers=1 ;;
            api-map) pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run src/services/gate-map-pins.database.test.ts src/services/gate-map-pins.test.ts src/services/gate-map-pin-sharing.test.ts src/services/gate-coverage-map.test.ts src/lib/notification-destination.test.ts --no-file-parallelism --maxWorkers=1 ;;
            api-staffing) pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run src/routes/staffRoles.test.ts src/routes/staffEnrollment.test.ts src/services/staff-enrollment.test.ts src/services/staff-enrollment-send.test.ts src/lib/staff-enrollment-email.test.ts src/routes/staff-profile-account.test.ts src/routes/workHubGateShiftDefinitions.test.ts src/work-hub/gate-shift-definitions.test.ts src/work-hub/gate-shift-definition-policy.test.ts src/work-hub/calendar-event-policy.test.ts src/routes/workHubTaskHopper.test.ts src/work-hub/task-hopper-policy.test.ts --no-file-parallelism --maxWorkers=1 ;;
            api-workforce) pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run src/routes/staff-profile-account.test.ts src/routes/web-error-payload-shape-coverage.test.ts src/services/managed-worker-manual.test.ts src/assistant/gate-staffing-candidates.test.ts src/services/gate-coverage-monitor.test.ts --no-file-parallelism --maxWorkers=1 ;;
            api-gate) pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run src/services/gate-arrivals.database.test.ts src/services/gate-arrivals.test.ts src/routes/visits.test.ts --no-file-parallelism --maxWorkers=1 ;;
            browser) pnpm run test:e2e ;;
            browser-workspace) pnpm run test:e2e tests/work-hub-workspace.spec.ts ;;
            browser-workforce) pnpm run test:e2e tests/managed-subcontractors.spec.ts tests/staff-role-catalog.spec.ts tests/org-members-flow.spec.ts ;;
            browser-gate) pnpm run test:e2e tests/gate-change-over.spec.ts ;;
            browser-*) shard='${{ matrix.check }}'; pnpm run test:e2e --shard="${shard#browser-}/4" ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.check, 'browser')
        with:
          name: handoff-${{ matrix.check }}-results
          path: |
            lib/e2e/playwright-report
            lib/e2e/test-results

