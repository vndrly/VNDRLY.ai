name: Verify release

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VNDRLY_TEST_DB_MODE: fresh-local
      VNDRLY_TEST_DB_MAINTENANCE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      VNDRLY_LOAD_ENV_LOCAL: '0'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the pinned test browser
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/e2e exec playwright install --with-deps chromium
          browser_path="$(pnpm --filter @workspace/e2e exec node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser_path"
          printf 'PLAYWRIGHT_CHROMIUM=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Start a new runner-local PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_config >/dev/null || ! test -x "$(pg_config --bindir)/initdb"; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql
          fi
          pg_bin="$(pg_config --bindir)"
          pg_data="$RUNNER_TEMP/vndrly-verification-postgres"
          test ! -e "$pg_data"
          # This empty cluster exists only on the disposable CI VM and listens
          # exclusively on loopback. No deployment/database secrets are loaded.
          "$pg_bin/initdb" --pgdata="$pg_data" --username=postgres --auth=trust
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/vndrly-postgres.log" --options="-h 127.0.0.1 -p 55439 -k '$RUNNER_TEMP'" --wait start
          printf 'VNDRLY_CI_PG_BIN=%s\nVNDRLY_CI_PG_DATA=%s\n' "$pg_bin" "$pg_data" >> "$GITHUB_ENV"

      - name: Typecheck and locale parity
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/fresh-test-database.test.mjs
          pnpm run typecheck
          pnpm lint:i18n

      - name: Independent database-backed API gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run test:api 2>&1 | tee "$RUNNER_TEMP/vndrly-api-tests.log"

      - name: Full required test chain
        shell: bash
        run: |
          set -euo pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/vndrly-tests.log"

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vndrly-tests.log
            ${{ runner.temp }}/vndrly-api-tests.log
            ${{ runner.temp }}/vndrly-postgres.log
            lib/e2e/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Stop the runner-local PostgreSQL cluster
        if: always() && env.VNDRLY_CI_PG_DATA != ''
        shell: bash
        run: '"$VNDRLY_CI_PG_BIN/pg_ctl" --pgdata="$VNDRLY_CI_PG_DATA" --mode=fast --wait stop'
