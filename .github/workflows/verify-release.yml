name: Focused isolated security fixture diagnostic

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VNDRLY_TEST_DB_MODE: fresh-local
      VNDRLY_TEST_DB_MAINTENANCE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      VNDRLY_LOAD_ENV_LOCAL: '0'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Start a new runner-local PostgreSQL cluster
        id: postgres
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_config >/dev/null || ! test -x "$(pg_config --bindir)/initdb"; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql
          fi
          pg_bin="$(pg_config --bindir)"
          pg_data="$RUNNER_TEMP/vndrly-verification-postgres"
          test ! -e "$pg_data"
          # This empty cluster exists only on the disposable CI VM and listens
          # exclusively on loopback. No deployment/database secrets are loaded.
          "$pg_bin/initdb" --pgdata="$pg_data" --username=postgres --auth=trust
          "$pg_bin/pg_ctl" --pgdata="$pg_data" --log="$RUNNER_TEMP/vndrly-postgres.log" --options="-h 127.0.0.1 -p 55439 -k '$RUNNER_TEMP'" --wait start
          printf 'VNDRLY_CI_PG_BIN=%s\nVNDRLY_CI_PG_DATA=%s\n' "$pg_bin" "$pg_data" >> "$GITHUB_ENV"

      - name: Verify fresh test database safety invariants
        id: db-safety
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/fresh-test-database.test.mjs

      - name: Focused isolated inherited fixture diagnostic
        id: api
        if: >-
          ${{ !cancelled() &&
              steps.dependencies.outcome == 'success' &&
              steps.postgres.outcome == 'success' &&
              steps.db-safety.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server exec tsx scripts/run-with-test-db.ts -- corepack pnpm exec vitest run --no-file-parallelism src/routes/inventory-recovery.database.test.ts src/routes/orgMembers.test.ts src/routes/ticket-comments-access.database.test.ts 2>&1 | tee "$RUNNER_TEMP/vndrly-api-tests.log"

      - name: Retain failed API gate diagnostics immediately
        if: ${{ !cancelled() && steps.api.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-api-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/vndrly-api-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-security-fixture-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vndrly-api-tests.log
            ${{ runner.temp }}/vndrly-postgres.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop the runner-local PostgreSQL cluster
        if: always() && env.VNDRLY_CI_PG_DATA != ''
        shell: bash
        run: '"$VNDRLY_CI_PG_BIN/pg_ctl" --pgdata="$VNDRLY_CI_PG_DATA" --mode=fast --wait stop'
