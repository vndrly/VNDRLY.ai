name: Deploy API
# Full-ship API verification: 2026-09-04

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/drizzle/**"
      - "scripts/plate-state-migration.mjs"
      - "scripts/notes-admission-migration.mjs"
      - "scripts/askv-greeting-migration.mjs"
      - "scripts/assistant-action-audit-migration.mjs"
      - "scripts/work-hub-*-migration.mjs"
      - "scripts/provision-work-hub-audio.sh"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vndrly-production-api
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API to GoDaddy VPS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_PASSWORD VPS_PORT; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::$name is not configured"
              exit 1
            fi
          done
          if [[ ! "$VPS_HOST" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ || "$VPS_HOST" == *..* ]]; then
            echo "::error::VPS_HOST must be a plain hostname or IPv4 address"
            exit 1
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid release commit"; exit 1; }

      - name: Install SSH deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass

      - name: Fetch, build, migrate, and restart API
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          sshpass -e ssh \
            -p "$VPS_PORT" \
            -o ConnectTimeout=20 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "EXPECTED_SHA=$EXPECTED_SHA RELAY_HOST=$VPS_HOST bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR=/var/www/vndrly
          cd "$APP_DIR"
          sudo -u vndrly git remote set-url origin https://github.com/vndrly/VNDRLY.ai.git
          sudo -u vndrly git fetch origin main
          sudo -u vndrly git diff --exit-code --quiet
          sudo -u vndrly git diff --cached --exit-code --quiet
          sudo -u vndrly git switch --detach "$EXPECTED_SHA"
          actual="$(sudo -u vndrly git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "VPS HEAD $actual does not match $EXPECTED_SHA" >&2
            exit 1
          fi
          export CI=true
          sudo -u vndrly env HOME=/home/vndrly pnpm install --frozen-lockfile
          sudo -u vndrly env HOME=/home/vndrly pnpm --filter @workspace/api-server run build
          sudo bash scripts/provision-work-hub-audio.sh "$RELAY_HOST"
          database_url="$(sudo sed -n 's/^DATABASE_URL=//p' .env.production | head -n 1)"
          if [ -z "$database_url" ]; then
            echo "DATABASE_URL missing from .env.production; refusing API restart" >&2
            exit 1
          fi
          openai_key="$(sudo sed -n 's/^OPENAI_API_KEY=//p' .env.production | head -n 1)"
          if [ -z "$openai_key" ]; then
            echo "OPENAI_API_KEY missing from .env.production; refusing to enable natural voice" >&2
            exit 1
          fi
          sudo sed -i '/^ASKV_NATURAL_VOICE_USER_IDS=/d' .env.production
          if ! sudo grep -q '^ASKV_NATURAL_VOICE_ENABLED=' .env.production; then
            sudo sed -i '$aASKV_NATURAL_VOICE_ENABLED=1' .env.production
          fi
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:plate-state
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:notes-admission
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:vendor-note-ownership
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:visit-entry-category
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" APPLY_PARTNER_OWNED_CATALOGS=1 pnpm --filter @workspace/api-server run migrate:partner-owned-catalogs
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:assistant-action-audit
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:askv-greeting
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-flags
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-core
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-domains
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-notifications
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-imports
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-channel-visibility
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-project-calendar
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-collaboration
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-finance
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-calls
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-scheduling
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" pnpm --filter @workspace/api-server run migrate:work-hub-file-library
          sudo -u vndrly env HOME=/home/vndrly DATABASE_URL="$database_url" APPLY_PUBLIC_DATA_API_HARDENING=1 pnpm --filter @workspace/api-server run migrate:public-data-api-hardening
          # The additive schema defaults Work Hub off. This authorized launch opts in
          # only when the VPS has no explicit environment rollout setting.
          if ! sudo grep -q '^WORK_HUB_ENABLED=' .env.production; then
            sudo sed -i '$aWORK_HUB_ENABLED=1' .env.production
          fi
          unset database_url openai_key
          sudo systemctl daemon-reload
          sudo systemctl enable vndrly-api 2>/dev/null || true
          sudo systemctl restart vndrly-api
          REMOTE

      - name: Verify API health
        run: curl --fail --silent --show-error --retry 8 --retry-delay 3 https://vndrly.ai/api/healthz
