name: Publish Mobile OTA
# Full-ship release-path verification: 2026-08-28T15:50Z

on:
  workflow_dispatch:
    inputs:
      message:
        description: Release note shown in the EAS update history.
        required: true
        default: "Fix Gate voice press-to-toggle recording"

permissions:
  contents: read

concurrency:
  group: vndrly-production-mobile-ota
  cancel-in-progress: false

jobs:
  publish-ios-update:
    name: Validate and publish iOS update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error title=Missing Expo secret::EXPO_TOKEN is not configured"
            exit 1
          fi
          pnpm --filter @workspace/vndrly-mobile exec eas whoami

      - name: Find installed production runtime commit
        id: production-build
        shell: bash
        run: |
          set -euo pipefail
          builds_file="${RUNNER_TEMP}/eas-ios-production-builds.json"
          pnpm --filter @workspace/vndrly-mobile exec eas build:list \
            --platform ios \
            --profile production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive >"$builds_file"
          build_ref="$(node scripts/eas-production-runtime-commit.mjs "$builds_file")"
          echo "base_ref=$build_ref" >>"$GITHUB_OUTPUT"

      - name: Classify native-impact changes
        id: release-impact
        run: >-
          node scripts/mobile-release-impact.mjs
          --base-ref "${{ steps.production-build.outputs.base_ref }}"
          --github-output

      - name: Record TestFlight-required release
        if: steps.release-impact.outputs.requires_native_build == 'true'
        shell: bash
        run: |
          echo "### OTA intentionally skipped" >>"$GITHUB_STEP_SUMMARY"
          echo "TestFlight-required release detected; the OTA safety guard did not publish an incompatible update." >>"$GITHUB_STEP_SUMMARY"

      - name: Build shared TypeScript declarations
        if: steps.release-impact.outputs.requires_native_build == 'false'
        run: pnpm run typecheck:libs

      - name: Typecheck mobile app
        if: steps.release-impact.outputs.requires_native_build == 'false'
        run: pnpm --filter @workspace/vndrly-mobile run typecheck

      - name: Test mobile app
        if: steps.release-impact.outputs.requires_native_build == 'false'
        run: pnpm --filter @workspace/vndrly-mobile exec vitest run --maxWorkers=2 --retry=1

      - name: Publish production iOS OTA update
        if: steps.release-impact.outputs.requires_native_build == 'false'
        working-directory: artifacts/vndrly-mobile
        env:
          EAS_UPDATE_MESSAGE: ${{ inputs.message }}
        run: >-
          pnpm exec eas update
          --channel production
          --environment production
          --platform ios
          --message "$EAS_UPDATE_MESSAGE"
          --non-interactive
